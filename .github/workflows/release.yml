# 发行构建：推 v* 标签触发，构建 release APK、校验签名、创建 GitHub Release。
#
# 需要的 Actions Secrets（缺任何一个都直接失败，绝不回落到 debug 签名）：
#   RELEASE_KEYSTORE_BASE64    keystore 文件的 base64
#   RELEASE_KEYSTORE_PASSWORD  keystore 口令
#   RELEASE_KEY_ALIAS          别名
#   RELEASE_KEY_PASSWORD       别名口令
#
# 校验环节会比对签名证书 SHA-256：与发行证书不符（例如误用 debug 签名）就失败。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查签名 Secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=0
          for v in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v 为空"; missing=1; fi
          done
          if [ "$missing" != 0 ]; then
            echo "::error::签名 Secrets 不齐 —— 拒绝构建（不能回落到 debug 签名）"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 准备 Android SDK 组件
        run: |
          set -euo pipefail
          # runner 自带 ANDROID_HOME；用固定版本的 cmdline-tools 覆盖，保证认得
          # platforms;android-37.0（旧版 setup-android 会去装已下架的 tools 包）
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extract
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv /tmp/cmdline-tools-extract/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: 写 keystore.properties
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          cat > "$GITHUB_WORKSPACE/keystore.properties" <<EOF
          storeFile=$GITHUB_WORKSPACE/release.keystore
          storePassword=$RELEASE_KEYSTORE_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          keyPassword=$RELEASE_KEY_PASSWORD
          EOF

      - name: 构建 release APK
        env:
          DSHA_REQUIRE_RELEASE_SIGNING: '1'
        run: ./gradlew assembleRelease

      - name: 校验签名并重命名
        id: apk
        env:
          EXPECTED_CERT_SHA256: f16ffbc3c2712b5ec877a09911a7ca40640c7c3e9a779fe0f96c623c11d5548c
        run: |
          set -euo pipefail
          src=$(ls app/build/outputs/apk/release/*.apk | head -1)
          version=${GITHUB_REF_NAME#v}
          name="DSHA-$version-release.apk"
          cp "$src" "$name"

          cert_line=$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$name" \
            | grep 'certificate SHA-256 digest' | head -1 || true)
          cert=$(printf '%s' "$cert_line" | grep -oE '[0-9a-f]{64}' | head -1 || true)
          if [ -z "$cert" ]; then
            echo "::error::拿不到签名证书指纹（apksigner verify 失败？）"
            exit 1
          fi
          echo "签名证书 SHA-256: $cert"
          if [ "$cert" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::签名证书不符（$cert），期望 $EXPECTED_CERT_SHA256 —— 不是发行证书，拒绝发布"
            exit 1
          fi

          {
            echo "file=$name"
            echo "size=$(stat -c%s "$name")"
            echo "sha256=$(sha256sum "$name" | cut -d' ' -f1)"
            echo "cert=$cert"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: 生成发行说明
        run: |
          set -euo pipefail
          version="${{ steps.apk.outputs.version }}"

          # 从 CHANGELOG 抽本版段落（`## x.y.z` 到下一个 `## ` 之前）。
          # 抽不到就直接失败：发行说明写着上一版的内容，比什么都不写更糟 --
          # 用户会照着"新增 X 功能"去找一个并不存在的按钮。
          awk -v ver="## $version" '
            $0 == ver { show = 1; next }
            show && /^## / { exit }
            show { print }
          ' CHANGELOG.md > changes.md

          if [ ! -s changes.md ]; then
            echo "::error::CHANGELOG.md 里没有 $version 的段落，补齐再发"
            exit 1
          fi

          {
            cat <<'HEADER'
          ## 安装

          - 下载 `${{ steps.apk.outputs.file }}` 安装（Android 8.0+，arm64 / x86_64）。
          - **签名证书在 2.5.0 更换过**（旧证书 SHA-256 `274c45c9826650a87368e449fe51732a9ff823ccd76e2665b2741ecf34a53712` 已作废）。
            仍装着 2.4.1 及更早版本的设备**不能覆盖安装**：先在 设置 → 备份 导出备份（或 ZIP 归档），
            卸载旧版后再装本版，装回后导入备份。从 2.5.0 起一路升上来的直接覆盖即可。

          ## 这个版本改了什么

          HEADER
            cat changes.md
            cat <<'FOOTER'

          ## 已知问题

          - 本轮改动主要在主机与模拟环境验证，**新 UI 手势、运行环境、Python 下载安装**
            请以真机体验为准，问题请开 Issue
          - 不提供 apt / npm；需要装包只能走 pip（纯 Python 包与 musllinux wheel）

          ## 校验

          - 文件名：`${{ steps.apk.outputs.file }}`
          - 大小：`${{ steps.apk.outputs.size }}` 字节
          - SHA-256：`${{ steps.apk.outputs.sha256 }}`
          - 签名证书 SHA-256：`${{ steps.apk.outputs.cert }}`
          FOOTER
          } > notes.md

          echo "--- notes.md ---"
          cat notes.md

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.file }}" \
            --title "DSHA ${{ steps.apk.outputs.version }}" \
            --notes-file notes.md
