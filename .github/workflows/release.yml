# 发行构建：推 v* 标签触发，构建 release APK、校验签名、创建 GitHub Release。
#
# 需要的 Actions Secrets（缺任何一个都直接失败，绝不回落到 debug 签名）：
#   RELEASE_KEYSTORE_BASE64    keystore 文件的 base64
#   RELEASE_KEYSTORE_PASSWORD  keystore 口令
#   RELEASE_KEY_ALIAS          别名
#   RELEASE_KEY_PASSWORD       别名口令
#
# 校验环节会比对签名证书 SHA-256：与发行证书不符（例如误用 debug 签名）就失败。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查签名 Secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=0
          for v in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v 为空"; missing=1; fi
          done
          if [ "$missing" != 0 ]; then
            echo "::error::签名 Secrets 不齐 —— 拒绝构建（不能回落到 debug 签名）"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: 安装 Android SDK 组件
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: 写 keystore.properties
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          cat > "$GITHUB_WORKSPACE/keystore.properties" <<EOF
          storeFile=$GITHUB_WORKSPACE/release.keystore
          storePassword=$RELEASE_KEYSTORE_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          keyPassword=$RELEASE_KEY_PASSWORD
          EOF

      - name: 构建 release APK
        env:
          DSHA_REQUIRE_RELEASE_SIGNING: '1'
        run: ./gradlew assembleRelease

      - name: 校验签名并重命名
        id: apk
        env:
          EXPECTED_CERT_SHA256: f16ffbc3c2712b5ec877a09911a7ca40640c7c3e9a779fe0f96c623c11d5548c
        run: |
          set -euo pipefail
          src=$(ls app/build/outputs/apk/release/*.apk | head -1)
          version=${GITHUB_REF_NAME#v}
          name="DSHA-$version-release.apk"
          cp "$src" "$name"

          cert_line=$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$name" \
            | grep 'certificate SHA-256 digest' | head -1 || true)
          cert=$(printf '%s' "$cert_line" | grep -oE '[0-9a-f]{64}' | head -1 || true)
          if [ -z "$cert" ]; then
            echo "::error::拿不到签名证书指纹（apksigner verify 失败？）"
            exit 1
          fi
          echo "签名证书 SHA-256: $cert"
          if [ "$cert" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::签名证书不符（$cert），期望 $EXPECTED_CERT_SHA256 —— 不是发行证书，拒绝发布"
            exit 1
          fi

          {
            echo "file=$name"
            echo "size=$(stat -c%s "$name")"
            echo "sha256=$(sha256sum "$name" | cut -d' ' -f1)"
            echo "cert=$cert"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: 生成发行说明
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          ## 安装

          - **签名证书已更换**（旧证书 SHA-256 `274c45c9826650a87368e449fe51732a9ff823ccd76e2665b2741ecf34a53712` 作废）。
            装着 2.4.1 及更早版本的设备**不能覆盖安装**：请先在 设置 → 备份 导出备份（或 ZIP 归档），
            卸载旧版后再安装本版，装回后导入备份。直接覆盖安装会被系统以签名不一致拒绝。
          - 下载 `${{ steps.apk.outputs.file }}` 安装（Android 8.0+，arm64 / x86_64）。

          ## 这个版本改了什么

          **运行环境整体更换（musl + BusyBox + 按需下载的 CPython）**

          - proot 与 Ubuntu rootfs 全部移除：随包改为静态 musl 1.2.5 动态加载器 + BusyBox 1.37.0
            （ash 与两百来个命令），直接在 Android 上原生执行
          - Python 改为按需下载 musl 版 CPython 3.12（python-build-standalone），经随包 musl 启动；
            pip 可装纯 Python 包，musllinux wheel（numpy、pandas 等）验证可装
          - **apt 不再提供，npm 不再提供**；旧版安装过的 Ubuntu 环境可在「运行环境」页一键清理
          - AI 工具改名：`linux_shell` → `run_shell`，新增 `python`；`install_packages` 只走 pip

          **界面**

          - 全局按压回弹动效（按钮、卡片、列表行按下即缩放回弹）
          - 思考强度档位：输入栏新增 chip，滑杆五档（关/低/中/高/极高），拖动预览、松手生效
          - 首页图标可自定义：点空态图标换图（自动方裁、EXIF 转正）或恢复默认
          - 对话页任意位置右滑拉开历史抽屉，跟手速度决定吸附，打开时收起键盘
          - 修键盘开着时切换/打开话题出现内容重影

          **工具与工作区**

          - `write_file` / `edit_file` / `patch_file` 严格校验：缺参报错、歧义报错、写后回读
          - 思考完成前发出的工具调用整批作废并要求重发
          - 工作区路径解析修复：认工作区内绝对路径，`..` 逃逸一律拒绝

          ## 已知问题

          - **本轮改动均在主机与模拟环境（qemu）测试，尚未在真机验证** ——
            新 UI 手势、运行环境、Python 下载安装请以实际体验为准，问题请开 Issue
          - 不再提供 apt / npm；需要装包只能走 pip（纯 Python 包与 musllinux wheel）
          - 旧 Ubuntu 环境与新版不兼容，升级后请在「运行环境」页清理

          ## 校验

          - 文件名：`${{ steps.apk.outputs.file }}`
          - 大小：`${{ steps.apk.outputs.size }}` 字节
          - SHA-256：`${{ steps.apk.outputs.sha256 }}`
          - 签名证书 SHA-256：`${{ steps.apk.outputs.cert }}`
            （本版起的新发行证书；旧版证书 `274c45c9…3712` 已作废，两版不能覆盖安装）
          EOF

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.file }}" \
            --title "DSHA ${{ steps.apk.outputs.version }}" \
            --notes-file notes.md
